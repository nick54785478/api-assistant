<main class="flex-1 flex flex-column relative h-full bg-cover bg-center w-full" 
      [style.background-image]="agentMode === 'PLAYBOOK' ? 'radial-gradient(circle at top right, #e0f2fe 0%, #f0f9ff 100%)' : 'radial-gradient(circle at top right, var(--p-primary-50) 0%, var(--p-surface-ground) 100%)'"
      [style.transition]="'background-image 0.5s ease'">
    
  <!-- Chat Header -->
  <header class="glass-header p-3 flex align-items-center justify-content-between absolute top-0 w-full z-1 border-bottom-1" style="border-color: rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); backdrop-filter: blur(10px);">
    <div class="flex align-items-center gap-2">
      <i class="pi pi-bolt text-xl" style="color: var(--p-primary-500);"></i>
      <span class="font-semibold" style="color: var(--p-text-color);">API Assistant</span>
      <div *ngIf="agentMode === 'PLAYBOOK'" class="ml-2 px-2 py-1 text-xs font-bold border-round-xl flex align-items-center gap-1 shadow-1 fadein animation-duration-500" style="background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd;">
        <i class="pi pi-code text-xs"></i>劇本執行中
      </div>
    </div>
    
    <div class="flex gap-2">
      <button class="p-link border-round-xl transition-colors flex align-items-center gap-2 hover-bg px-3 py-2" style="border: 1px solid var(--p-surface-200); background: var(--p-surface-0);" (click)="openSettings.emit()">
        <i class="pi pi-globe text-primary"></i>
        <span class="text-sm font-bold hidden md:inline" style="color: var(--p-text-color);">全域 API 配置</span>
      </button>
      <p-button icon="pi pi-bars" [rounded]="true" [text]="true" severity="secondary" class="md:hidden"></p-button>
    </div>
  </header>

  <!-- Chat Messages -->
  <div class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-column gap-4 relative z-0 scroll-behavior-smooth">
    <!-- Spacer for absolute header -->
    <div style="height: 60px; flex-shrink: 0;" class="hidden md:block"></div>
    <div style="height: 50px; flex-shrink: 0;" class="block md:hidden"></div>
    
    <ng-container *ngFor="let msg of messages">
      
      <!-- AI Message -->
      <div *ngIf="msg.role === 'ai'" class="flex gap-3 max-w-full md:max-w-7xl mx-auto w-full fadeinleft animation-duration-300 align-items-start">
        <div class="w-2rem h-2rem md:w-3rem md:h-3rem border-circle flex align-items-center justify-content-center flex-shrink-0" style="background: linear-gradient(135deg, var(--p-primary-400), var(--p-primary-600)); box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);">
          <i class="pi pi-sparkles text-white text-sm md:text-xl"></i>
        </div>
        <div class="flex-1">
          <div class="text-sm mb-1" style="color: var(--p-text-muted-color);">API Assistant</div>
          <div class="line-height-3 text-sm md:text-base" style="color: var(--p-text-color); word-break: break-word; overflow-wrap: anywhere;">
            <markdown [data]="msg.content"></markdown>
          </div>
        </div>
      </div>

      <!-- User Message -->
      <div *ngIf="msg.role === 'user'" class="flex gap-3 max-w-full md:max-w-7xl mx-auto w-full flex-row-reverse fadeinright animation-duration-300 align-items-start">
        <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" class="flex-shrink-0"></p-avatar>
        <div class="flex-1 flex justify-content-end">
          <div class="px-3 py-2 md:px-4 md:py-3 border-round-2xl border-noround-top-right shadow-1 max-w-full md:max-w-30rem line-height-3 text-sm md:text-base border-1" style="background-color: var(--p-surface-0); color: var(--p-text-color); border-color: var(--p-surface-200); word-break: break-word; overflow-wrap: anywhere;">
            <markdown [data]="msg.content"></markdown>
          </div>
        </div>
      </div>

    </ng-container>

    <!-- AI Thinking Indicator -->
    <div *ngIf="isWaitingForResponse" class="flex gap-3 max-w-full md:max-w-7xl mx-auto w-full fadeinleft animation-duration-300">
      <div class="w-2rem h-2rem md:w-3rem md:h-3rem border-circle flex align-items-center justify-content-center flex-shrink-0" style="background: linear-gradient(135deg, var(--p-primary-400), var(--p-primary-600)); box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);">
        <i class="pi pi-spinner pi-spin text-white text-sm md:text-xl"></i>
      </div>
      <div class="flex-1 flex align-items-center">
        <div class="text-sm font-italic" style="color: var(--p-text-muted-color);">AI 正在思考...</div>
      </div>
    </div>

  </div>

  <!-- Input Area -->
  <div class="p-3 md:p-5 w-full z-1 flex-shrink-0">
    <div class="max-w-full md:max-w-7xl mx-auto">
      <div class="glass-panel border-round-3xl p-2 flex align-items-end gap-2">
        <p-button icon="pi pi-paperclip" [rounded]="true" [text]="true" severity="secondary" class="hidden md:inline-flex mb-1"></p-button>
        <textarea pTextarea [autoResize]="true" rows="1" placeholder="請輸入您的問題... (Shift + Enter 換行)" 
               [(ngModel)]="userInput" 
               (ngModelChange)="userInputChange.emit($event)" 
               (keydown)="onKeydown($event)" 
               class="w-full bg-transparent border-none outline-none shadow-none p-3 text-base flex-1" style="color: var(--p-text-color); resize: none; max-height: 150px; overflow-y: auto; line-height: 1.5;"></textarea>
        <p-button icon="pi pi-send" [rounded]="true" (onClick)="send()" [disabled]="!userInput.trim()" class="mb-1"></p-button>
      </div>
      <div class="text-center text-xs mt-3" style="color: var(--p-text-muted-color);">
        AI 可能會產生不準確的資訊，請斟酌參考。
      </div>
    </div>
  </div>
</main>
