<div class="h-full flex flex-column h-full">
  <div class="flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <h1 class="text-3xl font-bold text-gray-800 m-0" *ngIf="!agentSessionId">Playbooks</h1>
    <h1 class="text-2xl font-bold text-gray-800 m-0" *ngIf="agentSessionId">Session Playbooks</h1>
    <p-button label="Create Playbook" icon="pi pi-plus" (click)="createNew($event)" styleClass="white-space-nowrap"></p-button>
  </div>

  <div *ngIf="playbooks.length === 0" class="text-center py-8 text-gray-500">
    No playbooks found. Create one to get started!
  </div>

  <div class="grid formgrid">
    <div *ngFor="let playbook of playbooks" class="col-12 md:col-6 lg:col-4 p-3">
      <div class="bg-white rounded-lg shadow-md overflow-hidden border border-gray-200 h-full cursor-pointer hover:shadow-lg transition-all duration-200" 
           (click)="editPlaybook(playbook.id, $event)">
        <div class="p-6 relative">
          <div class="flex justify-content-between align-items-start mb-2">
            <h2 class="text-xl font-bold text-gray-800 m-0">{{ playbook.name }}</h2>
            <div class="flex gap-2">
              <p-button icon="pi pi-play" severity="success" [rounded]="true" [text]="true" size="small" (click)="executePlaybook(playbook.id, $event)" pTooltip="Execute Playbook" tooltipPosition="top"></p-button>
              <p-button icon="pi pi-copy" severity="secondary" [rounded]="true" [text]="true" size="small" (click)="clonePlaybook(playbook.id, $event)" pTooltip="Clone Playbook" tooltipPosition="top"></p-button>
              <i class="pi pi-pencil text-gray-400 mt-2"></i>
            </div>
          </div>
          
          <div *ngIf="playbook.agentSessionId" class="mb-3 text-xs font-semibold text-blue-600 bg-blue-100 px-2 py-1 rounded-md inline-block">
            <i class="pi pi-users mr-1"></i> Session ID: {{ playbook.agentSessionId.substring(0, 8) }}...
          </div>
          <div *ngIf="!playbook.agentSessionId" class="mb-3 text-xs font-semibold text-orange-600 bg-orange-100 px-2 py-1 rounded-md inline-block">
            <i class="pi pi-star-fill mr-1"></i> Reference Example
          </div>

          <p class="text-gray-600 mb-4 line-height-3 flex-grow-1">{{ playbook.description }}</p>
          <div class="flex align-items-center text-sm text-gray-500 mb-4">
            <span class="font-medium mr-2">Steps:</span> {{ playbook.steps.length }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
